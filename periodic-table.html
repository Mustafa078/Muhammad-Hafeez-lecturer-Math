<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Periodic Table</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --border: #1e293b;
    --text: #e2e8f0;
    --muted: #64748b;
    --alkali: #ef4444;
    --alkaline: #f97316;
    --transition-m: #eab308;
    --post-transition: #22c55e;
    --metalloid: #14b8a6;
    --nonmetal: #3b82f6;
    --halogen: #8b5cf6;
    --noble: #ec4899;
    --lanthanide: #06b6d4;
    --actinide: #f59e0b;
    --unknown: #475569;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    padding: 20px;
  }

  h1 {
    text-align: center;
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 6px;
    background: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
    letter-spacing: 2px;
    margin-bottom: 20px;
  }

  /* LEGEND */
  .legend {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-bottom: 20px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 0.7rem;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 2px;
  }

  /* GRID */
  .table-wrapper { overflow-x: auto; }

  .periodic-grid {
    display: grid;
    grid-template-columns: repeat(18, minmax(54px, 1fr));
    gap: 3px;
    min-width: 980px;
    margin: 0 auto;
  }

  .element {
    position: relative;
    border-radius: 4px;
    padding: 4px 3px 3px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--surface);
  }

  .element:hover {
    transform: scale(1.15);
    z-index: 10;
    box-shadow: 0 0 16px currentColor;
  }

  .element .num {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.55rem;
    color: rgba(255,255,255,0.5);
    align-self: flex-start;
    line-height: 1;
  }
  .element .sym {
    font-size: 1.1rem;
    font-weight: 700;
    line-height: 1.1;
  }
  .element .name {
    font-size: 0.42rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: rgba(255,255,255,0.7);
    line-height: 1;
  }
  .element .mass {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.42rem;
    color: rgba(255,255,255,0.45);
    line-height: 1;
  }

  /* Category colors */
  .alkali          { border-color: var(--alkali);        color: var(--alkali); }
  .alkaline-earth  { border-color: var(--alkaline);      color: var(--alkaline); }
  .transition      { border-color: var(--transition-m);  color: var(--transition-m); }
  .post-transition { border-color: var(--post-transition);color: var(--post-transition); }
  .metalloid       { border-color: var(--metalloid);     color: var(--metalloid); }
  .nonmetal        { border-color: var(--nonmetal);      color: var(--nonmetal); }
  .halogen         { border-color: var(--halogen);       color: var(--halogen); }
  .noble-gas       { border-color: var(--noble);         color: var(--noble); }
  .lanthanide      { border-color: var(--lanthanide);    color: var(--lanthanide); }
  .actinide        { border-color: var(--actinide);      color: var(--actinide); }
  .unknown-props   { border-color: var(--unknown);       color: var(--unknown); }

  .empty { background: transparent; border: none; cursor: default; }
  .empty:hover { transform: none; box-shadow: none; }

  /* lanthanide/actinide label placeholders */
  .series-label {
    background: transparent;
    border: 1px dashed var(--border);
    cursor: default;
    font-size: 0.5rem;
    text-align: center;
    color: var(--muted);
    letter-spacing: 0.5px;
  }
  .series-label:hover { transform: none; box-shadow: none; }

  /* Spacer rows */
  .spacer-row { grid-column: 1 / -1; height: 8px; }

  /* TOOLTIP */
  .tooltip {
    display: none;
    position: fixed;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 12px 14px;
    z-index: 1000;
    min-width: 200px;
    max-width: 260px;
    pointer-events: none;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  .tooltip.show { display: block; }
  .tt-header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .tt-sym { font-size: 2rem; font-weight: 700; }
  .tt-name { font-size: 0.9rem; color: var(--muted); }
  .tt-num { font-family: 'Share Tech Mono', monospace; font-size: 0.75rem; color: var(--muted); }
  .tt-row { display: flex; justify-content: space-between; font-size: 0.75rem; padding: 2px 0; border-bottom: 1px solid var(--border); }
  .tt-row:last-child { border-bottom: none; }
  .tt-label { color: var(--muted); }
  .tt-val { font-family: 'Share Tech Mono', monospace; }

  /* Print */
  @media print {
    body { background: white; color: black; padding: 5mm; }
    h1 { -webkit-text-fill-color: black; color: black; font-size: 1.2rem; }
    .subtitle { color: #666; }
    .tooltip { display: none !important; }
    .element { border: 1px solid #ccc !important; color: black !important; }
    .element .num, .element .name, .element .mass { color: #555 !important; }
    .periodic-grid { gap: 2px; }
    @page { size: A4 landscape; margin: 8mm; }
  }
</style>
</head>

function makeEl(num) {
  if (num === 0) {

    d.className = 'element empty';
    return d;
  }
  if (typeof num === 'string') {
    // series label
    const d = document.createElement('div');
    d.className = 'element empty series-label';
    d.innerHTML = num;
    return d;

  const e = elByNum[num];
  if (!e) return makeEl(0);
  const [n, sym, name, mass, cat] = e;
  const d = document.createElement('div');
  d.className = `element ${cat}`;
  d.innerHTML = `<span class="num">${n}</span><span class="sym">${sym}</span><span class="name">${name}</span><span class="mass">${mass}</span>`;

  d.addEventListener('mouseleave', hideTip);
  return d;
}

  // Row 7
  [87,88,'89-103',104,105,106,107,108,109,110,111,112,113,114,115,116,117,118],
];

const grid = document.getElementById('grid');

rows.forEach(row => {
  row.forEach(num => {
    if (num === '57-71') {
      const d = document.createElement('div');
      d.className = 'element empty series-label';
      d.innerHTML = '57–71<br>Lantha-<br>nides';
      grid.appendChild(d);
    } else if (num === '89-103') {
      const d = document.createElement('div');
      d.className = 'element empty series-label';
      d.innerHTML = '89–103<br>Acti-<br>nides';
      grid.appendChild(d);
    } else {
      grid.appendChild(makeEl(num));
    }
  });
});

// Spacer
const spacer = document.createElement('div');
spacer.className = 'spacer-row';
spacer.style.gridColumn = '1 / -1';
grid.appendChild(spacer);

// Lanthanides row (cols 3-17 = indices 2-16)
const lRow = Array(18).fill(0);
for (let i = 57; i <= 71; i++) lRow[i - 57 + 2] = i;
lRow.forEach(num => grid.appendChild(makeEl(num)));

// Spacer
const spacer2 = document.createElement('div');
spacer2.className = 'spacer-row';
spacer2.style.gridColumn = '1 / -1';
grid.appendChild(spacer2);

// Actinides row
const aRow = Array(18).fill(0);
for (let i = 89; i <= 103; i++) aRow[i - 89 + 2] = i;
aRow.forEach(num => grid.appendChild(makeEl(num)));

// Tooltip
const tip = document.getElementById('tooltip');
const catNames = {
  'alkali':'Alkali Metal','alkaline-earth':'Alkaline Earth Metal',
  'transition':'Transition Metal','post-transition':'Post-Transition Metal',
  'metalloid':'Metalloid','nonmetal':'Nonmetal','halogen':'Halogen',
  'noble-gas':'Noble Gas','lanthanide':'Lanthanide','actinide':'Actinide',
  'unknown-props':'Properties Unknown'
};

function showTip(ev, e) {
  const [n, sym, name, mass, cat,,, config, state] = e;
  tip.innerHTML = `
    <div class="tt-header">
      <span class="tt-sym">${sym}</span>
      <div><div style="font-size:1rem;font-weight:600">${name}</div><div class="tt-num">Atomic #${n}</div></div>
    </div>
    <div class="tt-row"><span class="tt-label">Atomic Mass</span><span class="tt-val">${mass}</span></div>
    <div class="tt-row"><span class="tt-label">Category</span><span class="tt-val">${catNames[cat]||cat}</span></div>
    <div class="tt-row"><span class="tt-label">State (STP)</span><span class="tt-val">${state}</span></div>
    <div class="tt-row"><span class="tt-label">Electron Config</span><span class="tt-val">${config}</span></div>
  `;
  tip.className = 'tooltip show';
  moveTip(ev);
}

function moveTip(ev) {
  let x = ev.clientX + 16, y = ev.clientY + 16;
  if (x + 260 > window.innerWidth) x = ev.clientX - 270;
  if (y + 150 > window.innerHeight) y = ev.clientY - 160;
  tip.style.left = x + 'px';
  tip.style.top = y + 'px';
}

document.addEventListener('mousemove', ev => {
  if (tip.classList.contains('show')) moveTip(ev);
});

function hideTip() { tip.className = 'tooltip'; }
</script>
</body>
</html>
